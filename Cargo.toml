[workspace]
members = ["crates/pillbox-core", "apps/pillbox-server", "apps/pillbox-client"]
default-members = ["crates/pillbox-core", "apps/pillbox-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.30", features = ["serde"] }
pillbox-core = { path = "crates/pillbox-core" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
