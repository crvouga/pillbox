[package]
name = "pillbox-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pillbox-core.workspace = true
serde.workspace = true
serde_json.workspace = true
bevy = { version = "=0.18.1", default-features = false, features = ["std", "bevy_log", "async_executor", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_pbr", "bevy_render", "bevy_scene", "bevy_mesh", "bevy_camera", "bevy_light", "bevy_shader", "bevy_window", "bevy_winit", "png", "x11", "bevy_gltf", "reflect_auto_register"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.114"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }

[features]
default = ["webgpu"]
webgpu = ["bevy/webgpu"]
webgl = ["bevy/webgl2"]
